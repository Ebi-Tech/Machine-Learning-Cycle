events {
    worker_connections 1024;
}

http {
    upstream flask_app {
        # Docker-compose DNS resolves "app" to all running replicas automatically.
        # Round-robin is the default load balancing strategy.
        server app:5000;
    }

    server {
        listen 80;

        # Increase timeouts for retraining requests which can take a while
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Increase max upload size for bulk image uploads and zip files
        client_max_body_size 100M;

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # These headers let Flask know it's behind a proxy
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: expose a simple nginx health check endpoint
        location /nginx-health {
            return 200 'nginx ok';
            add_header Content-Type text/plain;
        }
    }
}
