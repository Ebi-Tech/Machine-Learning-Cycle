events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Docker's internal DNS resolver. valid=5s means nginx re-resolves
        # the hostname every 5 seconds, picking up new/removed replicas.
        resolver 127.0.0.11 valid=5s;

        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 100M;

        location / {
            # Using a variable forces nginx to re-resolve on every request
            # instead of caching the DNS result from startup.
            set $backend http://app:5000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx-health {
            return 200 'nginx ok';
            add_header Content-Type text/plain;
        }
    }
}
