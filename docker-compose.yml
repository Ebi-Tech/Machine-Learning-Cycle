services:
  app:
    build: .
    volumes:
      - model-data:/app/models
      - retrain-data:/app/data/retrain
      - train-data:/app/data/train
      - test-data:/app/data/test
    environment:
      - FLASK_ENV=production
      - TF_CPP_MIN_LOG_LEVEL=3
    expose:
      - "5000"
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  model-data:
  retrain-data:
  train-data:
  test-data:
